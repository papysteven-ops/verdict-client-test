  <style  data-mono="./unified-shell-v1.css">
:root{
  color-scheme:dark;
  --shell-bg:#08090b;
  --shell-card:#11151a;
  --shell-line:#27303a;
  --shell-text:#f4f7fa;
  --shell-muted:#8d98a5;
  --shell-green:#22c55e;
  --shell-yellow:#eab308;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --sab-real:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --shell-height:68px;
  --context-offset:30px;
  --verdict-layout-height:calc(100vh + var(--verdict-standalone-gap,0px));
}
@supports(height:100dvh){:root{--verdict-layout-height:calc(100dvh + var(--verdict-standalone-gap,0px))}}
.workspace-access-pending .module-tabs{visibility:hidden}
/* Le Pilote consomme la zone sûre haute une seule fois dans son bandeau doré. */
html.pilot-embedded{--safe-top:0px}
*{box-sizing:border-box}
html,body{width:100%;margin:0;overflow:hidden;background:var(--shell-bg);color:var(--shell-text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
html{height:100%}
body{height:var(--verdict-layout-height);min-height:0;padding:0;display:grid;grid-template-rows:calc(var(--shell-height) + var(--safe-top) + var(--context-offset)) minmax(0,1fr)}
body.shell-startup-locked{grid-template-rows:0 minmax(0,1fr)}
body.shell-startup-locked .app-shell-header{visibility:hidden;opacity:0;pointer-events:none}
body.shell-startup-locked #unified-workspace{grid-row:2}
button{font:inherit}
.app-shell-header{
  position:relative;z-index:50;grid-row:1;align-self:start;width:100%;
  min-height:calc(var(--shell-height) + var(--safe-top));
  padding:calc(8px + var(--safe-top)) max(12px,var(--safe-right)) 8px max(12px,var(--safe-left));
  display:grid;grid-template-columns:auto minmax(340px,500px) auto;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--shell-line);
  background:linear-gradient(180deg,rgba(8,9,11,.98),rgba(8,9,11,.94));
  box-shadow:0 10px 28px rgba(0,0,0,.34);
  backdrop-filter:saturate(150%) blur(18px);
  transition:opacity .2s ease;
}
.app-shell-brand{display:flex;align-items:center;gap:9px;min-width:0}
.app-shell-brand img{flex:0 0 auto;border-radius:11px;filter:drop-shadow(0 0 10px rgba(234,179,8,.14))}
.app-shell-brand span{display:flex;min-width:0;flex-direction:column}
.app-shell-brand b{font-size:15px;line-height:1;letter-spacing:-.025em;white-space:nowrap}
.app-shell-brand sup{font-size:11px;color:var(--shell-green)}
.app-shell-brand small{margin-top:4px;color:var(--shell-muted);font-size:11px;white-space:nowrap}
.app-shell-context{position:absolute;left:max(12px,var(--safe-left));bottom:-28px;z-index:2;display:flex;align-items:center;gap:7px;max-width:min(72vw,420px);height:24px;padding:0 9px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(10,13,17,.94);color:#aab4bf;font-size:11px;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.app-shell-context span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.context-dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--shell-green);box-shadow:0 0 9px rgba(34,197,94,.65)}
.module-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--shell-line);border-radius:15px;background:#0d1116}
.module-tabs button{position:relative;min-width:108px;min-height:46px;padding:8px 11px;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;background:transparent;color:var(--shell-muted);font-weight:800;cursor:pointer;touch-action:manipulation;transition:background .18s ease,color .18s ease,box-shadow .18s ease,transform .1s ease}
.module-tabs button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.module-tabs button[aria-selected="true"]{background:linear-gradient(135deg,rgba(34,197,94,.19),rgba(234,179,8,.11));color:#f8fff9;box-shadow:inset 0 0 0 1px rgba(34,197,94,.42),0 0 18px rgba(34,197,94,.08)}
.module-tabs button[aria-busy="true"]{cursor:progress;box-shadow:inset 0 0 0 1px rgba(147,197,253,.58),0 0 18px rgba(96,165,250,.08)}
.module-tabs button:active{transform:scale(.985)}
.module-tabs button:focus-visible{outline:2px solid #7dd3fc;outline-offset:3px}
.network-state{display:inline-flex;align-items:center;gap:6px;color:#78d99a;font:750 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.network-state::before{content:"";width:7px;height:7px;flex:none;border-radius:50%;background:currentColor}
.network-state.weak{color:#f59e0b}
.network-state.checking{color:#94a3b8}
.network-state.offline{color:#ef4444}
.shell-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.notification-button{position:relative;display:grid;width:44px;height:44px;min-width:44px;place-items:center;padding:0;border:1px solid #33404c;border-radius:14px;background:linear-gradient(145deg,#151c23,#0d1217);color:#aeb9c4;box-shadow:inset 0 1px rgba(255,255,255,.035);cursor:pointer;touch-action:manipulation;transition:border-color .18s ease,color .18s ease,transform .1s ease,box-shadow .18s ease}
.notification-button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notification-button.has-notifications{border-color:rgba(251,113,133,.58);color:#f8fafc;box-shadow:0 0 22px rgba(239,68,68,.1),inset 0 1px rgba(255,255,255,.05)}
.notification-button:active{transform:scale(.96)}.notification-button:focus-visible{outline:2px solid #7dd3fc;outline-offset:3px}
.notification-badge{position:absolute;right:-7px;top:-7px;display:grid;min-width:22px;height:22px;padding:0 5px;place-items:center;border:2px solid #08090b;border-radius:999px;background:#ef3340;color:#fff;font:900 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 4px 12px rgba(239,51,64,.42)}
.notification-badge[hidden]{display:none}
.notification-layer{position:fixed;z-index:90;inset:0;display:flex;justify-content:flex-end;align-items:stretch;padding:calc(var(--safe-top) + 12px) max(12px,var(--safe-right)) max(12px,var(--safe-bottom)) 12px;background:rgba(2,4,7,.72);backdrop-filter:blur(13px) saturate(125%)}
.notification-layer[hidden]{display:none}
.notification-sheet{display:flex;width:min(480px,100%);min-width:0;max-height:100%;flex-direction:column;overflow:hidden;border:1px solid #34404c;border-radius:24px;background:radial-gradient(115% 70% at 100% 0,rgba(239,68,68,.08),transparent 52%),linear-gradient(155deg,#151b22,#0b0f13 68%);box-shadow:0 32px 90px rgba(0,0,0,.72),inset 0 1px rgba(255,255,255,.035);animation:notificationPanelIn .22s ease-out both}
.notification-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:24px 22px 17px;border-bottom:1px solid rgba(148,163,184,.14)}
